<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;display:grid;grid-template-columns:1fr .82fr;
  font-family:"Noto Sans JP",sans-serif;background:#fff;overflow:hidden}
.l{padding:54px 40px 54px 56px;display:flex;flex-direction:column;justify-content:center;background:#fff}
.area{display:flex;gap:8px;margin-bottom:22px}
.area span{border:1px solid rgba(27,27,33,.18);border-radius:6px;padding:5px 13px;
  font-size:16px;color:#4A4A55;white-space:nowrap}
h1{font-family:"Zen Old Mincho",serif;font-weight:700;color:#16204A;
  font-size:46px;line-height:1.45;letter-spacing:.03em}
.usp{margin-top:20px;font-size:19px;color:#4A4A55;line-height:1.7}
.usp b{color:#16204A;background:linear-gradient(transparent 60%,rgba(198,166,103,.42) 60%)}
.box{margin-top:26px;border:1px solid #C6A667;border-radius:6px;background:#F7F4EE;
  padding:16px 20px;display:flex;align-items:baseline;gap:12px}
.box .k{font-size:16px;font-weight:700;color:#A9863F;white-space:nowrap}
.box .v{font-family:"Jost",sans-serif;font-weight:600;font-size:54px;color:#16204A;line-height:1}
.box .u{font-size:17px;font-weight:700;color:#16204A}
.brand{margin-top:26px;font-family:"Jost",sans-serif;font-weight:600;font-size:26px;
  letter-spacing:.1em;color:#16204A}
.brand small{display:block;font-family:"Noto Sans JP";font-size:14px;font-weight:400;
  letter-spacing:.04em;color:#7A7A85;margin-top:3px}
.r{position:relative;overflow:hidden}
.r img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;
  clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);z-index:2}
.r::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,#C6A667,#D8C8A8);
  clip-path:polygon(0 0,16% 0,2% 100%,0 100%)}
</style></head><body>
<div class="l">
  <div class="area"><span>八丁堀駅・新富町駅から徒歩5分</span><span>完全個室・完全予約制</span></div>
  <h1>仕事は頑張れても、<br>身体はごまかせない。</h1>
  <p class="usp"><b>整えながら鍛える。</b>ストレッチ×パーソナル<br>トレーニングのハイブリッドジム。</p>
  <div class="box"><span class="k">初回体験 80分</span><span class="v">3,300</span><span class="u">円（税込）</span></div>
  <p class="brand">D/LIGHT GYM<small>整える × 鍛える｜東京・八丁堀</small></p>
</div>
<div class="r"><img src="http://localhost:8899/assets/img/hero-lat-pulldown-wide.webp" alt=""></div>
</body></html>
